<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Age Calculator</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:Arial, sans-serif;
    }

    body{
        min-height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        background:linear-gradient(135deg,#667eea,#764ba2);
    }

    .container{
        width:400px;
        background:#fff;
        padding:30px;
        border-radius:15px;
        box-shadow:0 10px 25px rgba(0,0,0,0.2);
        text-align:center;
    }

    h1{
        margin-bottom:20px;
        color:#333;
    }

    input{
        width:100%;
        padding:12px;
        margin:15px 0;
        border:2px solid #ddd;
        border-radius:8px;
        font-size:16px;
    }

    button{
        width:100%;
        padding:12px;
        background:#667eea;
        color:white;
        border:none;
        border-radius:8px;
        font-size:16px;
        cursor:pointer;
        transition:0.3s;
    }

    button:hover{
        background:#5642c5;
    }

    .error{
        color:red;
        margin-top:15px;
        font-weight:bold;
    }

    .result{
        margin-top:20px;
        font-size:20px;
        color:#222;
        font-weight:bold;
        line-height:1.8;
    }
</style>
</head>
<body>

<div class="container">
    <h1>🎂 Age Calculator</h1>

    <input type="date" id="dob">

    <button onclick="calculateAge()">Calculate Age</button>

    <p id="error" class="error"></p>
    <div id="result" class="result"></div>
</div>

<script>
function calculateAge() {
    const dob = document.getElementById("dob").value;
    const error = document.getElementById("error");
    const result = document.getElementById("result");

    error.innerHTML = "";
    result.innerHTML = "";

    if (dob === "") {
        error.innerHTML = "⚠ Please select your Date of Birth!";
        return;
    }

    let birthDate = new Date(dob);
    let today = new Date();

    let years = today.getFullYear() - birthDate.getFullYear();
    let months = today.getMonth() - birthDate.getMonth();
    let days = today.getDate() - birthDate.getDate();

    if (days < 0) {
        months--;
        let lastMonth = new Date(
            today.getFullYear(),
            today.getMonth(),
            0
        ).getDate();
        days += lastMonth;
    }

    if (months < 0) {
        years--;
        months += 12;
    }

    result.innerHTML = `
        <p>🎉 Your Age is:</p>
        <p>${years} Years</p>
        <p>${months} Months</p>
        <p>${days} Days</p>
    `;
}
</script>

</body>
</html>
